<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Policies — Radhika</title>
  <style>
    body {
      background: radial-gradient(circle at 50% 0%, #111c38 0%, #070b16 65%);
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      padding: 48px 18px;
      margin: 0;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      background: #0f172a;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      margin: 0 0 22px;
      font-size: 14.5px;
    }
    .app-link {
      display: block;
      padding: 16px 20px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 14px;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
    }
    .app-link span {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      color: #cbd5e1;
      margin-top: 4px;
    }
    .app-link:hover {
      border-color: #fbbf24;
      color: #fbbf24;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>App Privacy Policies</h1>
    <p>Official privacy policies for applications published by <strong>Radhika</strong> on Google Play.</p>
    <a class="app-link" href="./astral-sling/">
      Astral Sling &rarr;
      <span>Package ID: com.radhika.astralsling</span>
    </a>
  </main>
</body>
</html>
